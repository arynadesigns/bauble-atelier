<style>
/* Layout: a full-screen 3D stage with the toy hanging from a branch, and one floating Arc toolbar at the bottom whose dropdown menus open upwards.
   Tokens are Arc's foundation (light and dark, violet accent). */
:root {
  color-scheme: light;
  --background: #F4EFE7; --surface: oklch(100% 0 0); --surface-raised: oklch(100% 0 0); --surface-muted: oklch(97.8% 0 0);
  --foreground: oklch(15% 0 0); --text-secondary: oklch(46% 0 0); --text-muted: oklch(59% 0 0);
  --border: oklch(93.5% 0 0); --border-subtle: oklch(96.5% 0 0); --border-strong: oklch(82% 0 0);
  --accent: #7747ff; --accent-strong: #5528ce; --accent-subtle: rgb(119 71 255 / .13); --accent-foreground: #fff;
  --control-on: #7747ff; --control-glyph: #fff; --control-track: oklch(89.5% 0 0); --control-thumb: oklch(100% 0 0); --control-fill: #7747ff;
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .07), 0 1px 2px oklch(0% 0 0 / .14), 0 2px 6px oklch(0% 0 0 / .06);
  --gold: #c99a3c;
  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .035);
  --shadow-raised: 0 6px 18px oklch(0% 0 0 / .065), 0 1px 3px oklch(0% 0 0 / .035);
  --shadow-floating: 0 20px 48px oklch(0% 0 0 / .105), 0 3px 10px oklch(0% 0 0 / .045);
  --checker: repeating-conic-gradient(oklch(88% 0 0) 0 25%, oklch(100% 0 0) 0 50%) 0 0 / 10px 10px;
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
  --radius-control: .875rem; --radius-panel: 1.25rem; --radius-surface: 1.5rem; --radius-pill: 9999px;
  --control-height-sm: 2rem; --control-height-md: 2.5rem;
  --font-display: "Geist", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
  --text-xs: .75rem; --text-sm: .8125rem; --text-base: .9375rem; --text-3xl: 1.75rem; --text-field: .875rem;
  --tracking-display: -.03em; --tracking-body: -.01em; --leading-display: 1.1; --leading-body: 1.4;
  --ease-enter: cubic-bezier(.16,1,.3,1); --ease-standard: cubic-bezier(.22,1,.36,1);
  --ease-spring: linear(0, 0.0213, 0.0739, 0.1443, 0.2235, 0.305, 0.3849, 0.4606, 0.5305, 0.594, 0.6508, 0.7011, 0.7452, 0.7836, 0.8168, 0.8454, 0.8699, 0.8907, 0.9084, 0.9234, 0.9361, 0.9467, 0.9557, 0.9632, 0.9694, 0.9747, 0.979, 0.9826, 0.9857, 0.9882, 0.9902, 0.992, 0.9934, 0.9946, 0.9955, 0.9963, 1);
  --duration-instant: 100ms; --duration-fast: 150ms; --duration-standard: 200ms; --duration-spring: 440ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --background: oklch(19% 0 0); --surface: oklch(21.5% 0 0); --surface-raised: oklch(24% 0 0); --surface-muted: oklch(26% 0 0);
  --foreground: oklch(96% 0 0); --text-secondary: oklch(77% 0 0); --text-muted: oklch(64% 0 0);
  --border: oklch(29% 0 0); --border-subtle: oklch(25% 0 0); --border-strong: oklch(40% 0 0);
  --accent: #a78bff; --accent-strong: #c7b7ff; --accent-subtle: rgb(119 71 255 / .22);
  --control-on: #8a66ff; --control-track: oklch(33% 0 0); --control-thumb: oklch(97% 0 0); --control-fill: #8a66ff;
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .3), 0 1px 2px oklch(0% 0 0 / .35), 0 2px 6px oklch(0% 0 0 / .2);
  --gold: #e3bd6a;
  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .18); --shadow-raised: 0 8px 22px oklch(0% 0 0 / .22); --shadow-floating: 0 22px 55px oklch(0% 0 0 / .34);
  --checker: repeating-conic-gradient(oklch(42% 0 0) 0 25%, oklch(30% 0 0) 0 50%) 0 0 / 10px 10px;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(19% 0 0); --surface: oklch(21.5% 0 0); --surface-raised: oklch(24% 0 0); --surface-muted: oklch(26% 0 0);
  --foreground: oklch(96% 0 0); --text-secondary: oklch(77% 0 0); --text-muted: oklch(64% 0 0);
  --border: oklch(29% 0 0); --border-subtle: oklch(25% 0 0); --border-strong: oklch(40% 0 0);
  --accent: #a78bff; --accent-strong: #c7b7ff; --accent-subtle: rgb(119 71 255 / .22);
  --control-on: #8a66ff; --control-track: oklch(33% 0 0); --control-thumb: oklch(97% 0 0); --control-fill: #8a66ff;
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .3), 0 1px 2px oklch(0% 0 0 / .35), 0 2px 6px oklch(0% 0 0 / .2);
  --gold: #e3bd6a;
  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .18); --shadow-raised: 0 8px 22px oklch(0% 0 0 / .22); --shadow-floating: 0 22px 55px oklch(0% 0 0 / .34);
  --checker: repeating-conic-gradient(oklch(42% 0 0) 0 25%, oklch(30% 0 0) 0 50%) 0 0 / 10px 10px;
}
@media (max-width: 640px) { :root { --text-field: 1rem; } }

html, body { height: 100%; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-body); letter-spacing: var(--tracking-body); line-height: var(--leading-body); overflow: hidden; }
:focus:not(:focus-visible), [role="menuitem"]:focus, [role="menuitemradio"]:focus, [role="menuitemcheckbox"]:focus, [tabindex="-1"]:focus, input[type="text"]:focus { outline: none !important; }
:focus-visible:not([role^="menuitem"], [tabindex="-1"], input[type="text"]) { outline: 2px solid color-mix(in oklab, var(--accent-strong) 72%, transparent) !important; outline-offset: 2px !important; }

.stage { position: fixed; inset: 0; overflow: hidden; background: var(--background); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.grabbing { cursor: grabbing; }
.head { position: absolute; z-index: 2; pointer-events: none; left: max(24px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); }
.head h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--text-3xl); line-height: var(--leading-display); letter-spacing: var(--tracking-display); }
.head p { margin: 6px 0 0; font-size: var(--text-sm); color: var(--text-secondary); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; max-width: calc(100vw - 32px); bottom: calc(max(20px, env(safe-area-inset-bottom, 0px)) + 64px); font-size: var(--text-sm); text-align: center; color: var(--text-muted); pointer-events: none; transition: opacity var(--duration-standard) var(--ease-standard); }
.hint[data-gone], body[data-menu] .hint { opacity: 0; }
.credit { position: absolute; z-index: 2; line-height: 1.5; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); margin: 0; font-size: var(--text-xs); color: var(--text-muted); }
@media (max-width: 1180px) { .credit { bottom: calc(max(20px, env(safe-area-inset-bottom, 0px)) + 70px); } }  /* keeps clear of the toolbar when the screen is narrower */
.credit a { color: inherit; }

/* Floating toolbar (a layer that floats, so it carries --shadow-floating) */
.toolbar {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 6px;
  border: 1px solid var(--border); border-radius: var(--radius-surface); background: color-mix(in oklab, var(--surface-raised) 88%, transparent);
  box-shadow: var(--shadow-floating); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
/* Arc dropdown trigger */
.trigger {
  display: inline-flex; max-width: 100%; min-width: 0; min-height: var(--control-height-md); align-items: center; gap: 6px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: calc(var(--radius-surface) - 6px); background: var(--surface); color: var(--foreground); font: inherit; font-size: var(--text-sm); font-weight: 500; cursor: pointer;
  transition: background-color var(--duration-instant) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}
@media (hover: hover) and (pointer: fine) { .trigger:hover { border-color: var(--border-strong); background: var(--surface-muted); box-shadow: var(--shadow-resting); } }
.trigger[data-state="open"] { border-color: var(--border-strong); background: var(--surface-muted); box-shadow: none; }
.trigger:active { border-color: var(--border-strong); background: color-mix(in oklab, var(--surface-muted), var(--border) 55%); box-shadow: none; }
.triggerIcon { display: inline-flex; flex: none; color: var(--text-secondary); }
.trigger .label { display: none !important; position: relative; min-width: 0; overflow-x: clip; transition: width 300ms var(--ease-spring); }
.trigger .label > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trigger .label .in { animation: labelIn var(--duration-standard) var(--ease-enter); }
@keyframes labelIn { from { opacity: 0; transform: translateY(.3em); filter: blur(4px); } }
.chevron { flex: none; color: var(--text-muted); transition: transform var(--duration-spring) var(--ease-spring); }
.trigger[data-state="open"] .chevron { transform: rotate(180deg); }
.dots { display: inline-flex; }
.dots i { width: 14px; height: 14px; border-radius: 50%; margin-left: -4px; box-shadow: 0 0 0 1.5px var(--surface), inset 0 0 0 1px oklch(0% 0 0 / .14); }
.dots i:first-child { margin-left: 0; }

/* Arc dropdown menu, opening upward (data-side="top") */
.menu {
  --menu-y: 5px; position: fixed; z-index: 60; min-width: 12rem; max-width: calc(100vw - 24px); max-height: calc(100vh - 140px); overflow: auto; box-sizing: border-box; padding: 5px;
  border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface-raised); box-shadow: var(--shadow-floating);
  transform-origin: 50% 100%; overscroll-behavior: contain;
  transition: opacity var(--duration-fast) var(--ease-enter), transform var(--duration-spring) var(--ease-spring);
}
.menu[data-state="opening"] { opacity: 0; transform: translateY(var(--menu-y)) scale(.97); transition: none; }
.menu[data-state="opening"] .item { opacity: 0; transform: translateY(calc(var(--menu-y) * .4)); transition: none; }
.menu[data-state="closed"] { opacity: 0; transform: translateY(calc(var(--menu-y) * .5)) scale(.985); transition: opacity var(--duration-instant) var(--ease-standard), transform var(--duration-instant) var(--ease-standard); pointer-events: none; }
.highlight { position: absolute; top: 0; right: 5px; left: 5px; height: 36px; border-radius: calc(var(--radius-panel) - 6px); background: var(--surface-muted); opacity: 0; pointer-events: none; transition: opacity var(--duration-instant) linear; }
.highlight[data-glide] { transition: transform 300ms var(--ease-spring), height 300ms var(--ease-spring), opacity var(--duration-instant) linear; }
.item {
  position: relative; display: flex; width: 100%; min-height: 36px; align-items: center; gap: 10px; padding: 0 11px; box-sizing: border-box; border: 0; background: none;
  border-radius: calc(var(--radius-panel) - 6px); color: var(--foreground); font: inherit; font-size: var(--text-sm); text-align: start; cursor: pointer; outline: none;
  transition: color var(--duration-fast) var(--ease-standard), opacity var(--duration-standard) var(--ease-enter) calc(min(var(--i, 0), 4) * 35ms), transform var(--duration-standard) var(--ease-enter) calc(min(var(--i, 0), 4) * 35ms);
}
.item .icon { display: inline-flex; width: 17px; flex: none; justify-content: center; color: var(--text-secondary); }
.item .icon canvas { width: 17px; height: 17px; display: block; }
.item .icon i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .12); }
.item .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .check { flex: none; color: var(--accent); opacity: 0; }
.item[aria-checked="true"] .check { opacity: 1; }
.tile-grid { display: grid; gap: 4px; }
.item.tile { width: 44px; height: 44px; min-height: 0; padding: 0; justify-content: center; gap: 0; }
.item.tile .icon { width: auto; }
.item.tile .icon canvas { width: 24px; height: 24px; }
.item.tile[aria-checked="true"] { background: var(--accent-subtle); box-shadow: inset 0 0 0 1.5px var(--accent); }
.separator { height: 1px; margin: var(--space-1) calc(var(--space-1) * -1); background: var(--border-subtle); }
.menu-section { padding: 8px 11px 10px; }
.menu-note { margin: 0; padding: 4px 11px 8px; font-size: var(--text-xs); color: var(--text-muted); }
@media (prefers-reduced-transparency: reduce) { .toolbar { background: var(--surface-raised); backdrop-filter: none; -webkit-backdrop-filter: none; } }

/* Arc slider */
.slider { --slider-thumb: 22px; --slider-track: 6px; display: grid; width: 100%; min-width: 0; color: var(--foreground); font-size: var(--text-sm); user-select: none; -webkit-user-select: none; }
.slider .sl-head { display: flex; min-width: 0; align-items: baseline; justify-content: space-between; gap: var(--space-4); }
.slider .sl-label { min-width: 0; font-weight: 500; }
.slider .readout { display: inline-flex; flex: none; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.slider .control { position: relative; height: var(--control-height-md); cursor: pointer; touch-action: pan-y; }
.slider .track { position: absolute; top: 50%; right: calc(var(--slider-thumb) / 2); left: calc(var(--slider-thumb) / 2); height: var(--slider-track); margin-top: calc(var(--slider-track) / -2); border-radius: var(--radius-pill); background: var(--control-track); }
.slider .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--slider-fill, var(--control-fill)); }
.slider .thumbs { position: absolute; inset: 0 calc(var(--slider-thumb) / 2); pointer-events: none; }
.slider .thumb { position: absolute; top: 50%; left: 0; box-sizing: border-box; width: var(--slider-thumb); height: var(--slider-thumb); margin: calc(var(--slider-thumb) / -2) 0 0 calc(var(--slider-thumb) / -2); border-radius: var(--radius-pill); background: var(--control-thumb); box-shadow: var(--control-thumb-shadow); pointer-events: auto; cursor: grab; transition: scale var(--duration-spring) var(--ease-spring); }
.slider .thumb::after { content: ""; position: absolute; inset: -11px; border-radius: inherit; }
.slider[data-dragging] .thumb { scale: 1.08; cursor: grabbing; }
.slider .bubble { position: absolute; bottom: calc(50% + var(--slider-thumb) / 2 + 8px); left: 0; display: inline-flex; min-height: 1.75rem; align-items: center; padding: 0 var(--space-3); border: 1px solid color-mix(in oklab, var(--background) 14%, var(--foreground)); border-radius: var(--radius-pill); background: var(--foreground); color: var(--background); box-shadow: var(--shadow-raised); font-weight: 500; white-space: nowrap; transform-origin: 50% 100%; translate: -50% 0; scale: .6; opacity: 0; pointer-events: none; transition: scale 300ms var(--ease-spring), opacity var(--duration-fast) var(--ease-standard); }
.slider[data-dragging] .bubble, .slider .thumb:focus-visible ~ .bubble { scale: 1; opacity: 1; }
@media (pointer: coarse) { .slider .bubble { bottom: calc(50% + var(--slider-thumb) / 2 + 18px); } }
.roll { display: inline-flex; }
.roll .col { position: relative; display: inline-block; overflow: hidden; height: 1.4em; }
.roll .col > span { display: block; transition: transform 300ms var(--ease-spring); }
.roll .col > span > b { display: block; height: 1.4em; font-weight: inherit; text-align: center; }

/* Arc colour picker (swatch trigger that grows into the picker, opening upward here) */
.cp-row { display: grid; gap: 6px; padding: 4px; }
.cp-trigger {
  display: flex; height: 44px; width: 100%; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-resting); color: inherit; font: inherit; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-standard);
}
@media (hover: hover) and (pointer: fine) { .cp-trigger:hover { border-color: var(--border-strong); } }
.cp-text { display: grid; min-width: 0; text-align: start; line-height: 1.15; flex: 1; }
.cp-name { color: var(--text-secondary); font-size: var(--text-xs); }
.cp-hex { font-size: var(--text-sm); font-variant-numeric: tabular-nums; font-weight: 500; }
.chip { position: relative; display: block; width: 32px; height: 32px; flex: none; overflow: hidden; border-radius: 50%; background: var(--checker); }
.chip > span { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .1); }
.cp-float { position: fixed; z-index: 70; filter: drop-shadow(0 18px 36px oklch(0% 0 0 / .12)) drop-shadow(0 2px 6px oklch(0% 0 0 / .06)); }
.cp-panel { width: min(19rem, calc(100vw - 32px)); box-sizing: border-box; padding-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface-raised); clip-path: inset(var(--clip, 0) round 22px); transition: clip-path 300ms var(--ease-spring); }
.cp-head { display: flex; height: 44px; align-items: center; gap: 10px; padding: 6px 6px 6px 6px; }
.cp-actions { display: flex; gap: 2px; }
.icon-btn { display: grid; width: 32px; height: 32px; place-items: center; padding: 0; border: 0; border-radius: 12px; background: transparent; color: var(--text-secondary); cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard); }
.icon-btn:active { transform: scale(.96); }
@media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--surface-muted); color: var(--foreground); } }
.cp-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 8px 14px 0; }
.cp-area { position: relative; height: 164px; border-radius: 16px; cursor: crosshair; touch-action: none; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), var(--picker-hue); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .08); }
.cp-thumb { position: absolute; width: 22px; height: 22px; border-radius: 50%; translate: -50% -50%; cursor: grab; box-shadow: 0 0 0 3px #fff, 0 2px 8px oklch(0% 0 0 / .3), inset 0 0 0 1px oklch(0% 0 0 / .12); transition: scale var(--duration-spring) var(--ease-spring); }
.cp-area .cp-thumb { background: var(--picker-opaque); }
.cp-area[data-active] .cp-thumb, .cp-thumb[data-active] { scale: 1.2; cursor: grabbing; }
.cp-slider { position: relative; height: 14px; margin: 0 11px; border-radius: var(--radius-pill); cursor: pointer; touch-action: none; }
.cp-slider::before { content: ""; position: absolute; inset: 0 -11px; border-radius: inherit; background: var(--track); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .08); }
.cp-slider .cp-thumb { top: 50%; background: var(--thumb-fill); }
.cp-hue { --track: linear-gradient(to right, #f00 11px, #ff0 calc(11px + (100% - 22px) * .1666), #0f0 calc(11px + (100% - 22px) * .3333), #0ff 50%, #00f calc(11px + (100% - 22px) * .6666), #f0f calc(11px + (100% - 22px) * .8333), #f00 calc(100% - 11px)); }
.cp-field { display: flex; height: 40px; align-items: stretch; overflow: hidden; margin-top: 2px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-muted); transition: border-color var(--duration-fast) var(--ease-standard); }
.cp-field[data-invalid] { border-color: oklch(53% .18 10); animation: shake .3s var(--ease-standard); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.cp-format { display: flex; min-width: 56px; align-items: center; justify-content: center; padding: 0 10px; border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--foreground); font: inherit; font-size: var(--text-xs); font-weight: 500; cursor: pointer; }
.cp-input { flex: 1; min-width: 0; padding: 0 10px; border: 0; background: transparent; color: var(--foreground); font: inherit; font-size: var(--text-field); font-variant-numeric: tabular-nums; }
.cp-swatches { display: flex; align-items: center; gap: 6px; min-height: 32px; flex-wrap: wrap; }
.cp-swatch { display: grid; width: 30px; height: 30px; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.cp-swatch .chip { width: 26px; height: 26px; transition: scale var(--duration-spring) var(--ease-spring); }
.cp-swatch[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--foreground); }
.cp-swatch[aria-selected="true"] .chip { scale: .78; }

/* toolbar dividers and the Surprise me button */
.tb-divider { flex: none; align-self: stretch; width: 1px; margin: 8px 2px; background: var(--border); }
.trigger.surprise .triggerIcon.spin { animation: diceSpin .5s var(--ease-spring); }
@keyframes diceSpin { from { transform: rotate(-200deg) scale(.8); } }

/* Arc signature pad, adapted for a message: same ink, surface and toolbar, no baseline, signer or export */
.inkpad { display: grid; gap: 10px; width: 100%; min-width: 0; }
.ink-surface { position: relative; aspect-ratio: 600 / 260; overflow: hidden; border: 1px solid var(--border); border-radius: calc(var(--radius-panel) - 6px); cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; isolation: isolate; transition: border-color var(--duration-fast) var(--ease-standard); }
.ink-surface[data-drawing] { border-color: var(--border-strong); }
.ink-hint { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 4px 12px; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--surface) 82%, transparent); color: var(--text-secondary); font-size: var(--text-base); white-space: nowrap; pointer-events: none; transition: opacity var(--duration-standard) var(--ease-standard); }
.ink-layer { position: absolute; inset: 0; pointer-events: none; }
